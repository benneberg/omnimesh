name: CI / Production Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Static Type Check & Lint
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm test

      - name: Production Bundle Build
        run: npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          test -f dist/server.cjs || { echo "Missing dist/server.cjs"; exit 1; }
          echo "Production artifacts verified successfully."
