<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OmniScreenMesh - Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Handles client routing on refresh for pages like /fleet or /simulator/dev-001
      var l = window.location;
      var isProjectPage = l.hostname.endsWith('github.io') && l.pathname.split('/').filter(Boolean).length >= 1;
      var pathSegmentsToKeep = isProjectPage ? 1 : 0;

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 20vh; color: #64748b;">
      Loading OmniScreenMesh Console...
    </p>
  </body>
</html>
