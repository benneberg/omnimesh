<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>omni-screenmesh</title>
    <meta name="description" content="OmniScreenMesh digital signage and multi-screen synchronization application." />
    <meta property="og:title" content="omni-screenmesh" />
    <meta property="og:description" content="OmniScreenMesh digital signage and multi-screen synchronization application." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="text/javascript">
      // GitHub Pages Single Page Apps redirection decoder
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', (event) => {
        const isOurAppError = event.filename && event.filename.startsWith(window.location.origin);
        if (isOurAppError) {
          navigator.sendBeacon('/api/client-errors', JSON.stringify({
            message: event.message,
            url: window.location.href,
            userAgent: navigator.userAgent,
            source: event.filename,
            lineno: event.lineno,
            colno: event.colno,
            stack: event.error ? event.error.stack : null,
            timestamp: new Date().toISOString()
          }));
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
